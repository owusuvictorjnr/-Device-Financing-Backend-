
name: Device Financing Backend CI/CD
on:
  push:
    branches:
      - staging
      - production

env:
  NODE_VERSION: 20

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Build application
        run: yarn build

      - name: Run tests
        run: yarn test --passWithNoTests

      - name: Create CI env file for Compose validation
        run: |
          cat > .env << 'EOF'
          NODE_ENV=test
          PORT=3000
          JWT_SECRET=ci-placeholder-secret
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/device_financing
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF

      - name: Validate Docker Compose config
        env:
          API_HOST_PORT: "3001"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: device_financing
          POSTGRES_HOST_PORT: "5433"
        run: docker compose config > /dev/null
