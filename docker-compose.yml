  api:
    build: .
    container_name: device-financing-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: node dist/main.js
    volumes:
      - .:/app

  worker:
    build: .
    container_name: device-financing-worker
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: yarn worker

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: device_financing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  volumes:
    postgres_data:
    redis_data:
